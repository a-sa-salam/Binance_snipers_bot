name: Run Python Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install and Start Proxy (WARP)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ focal main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            signals_state.json
            logs
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run Bot
        env:
          PROXY_URL: http://127.0.0.1:40000
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADE_USDT: '3'
          NET_PROFIT_PCT: '1.5'
          STOP_PCT: '2'
          MAX_MINUTES: '60'
          TOP_COINS: '5000'
          TOP_FINAL: '50'
          MODE: signals
          TIMEZONE: Africa/Khartoum
        run: timeout 345m python bot.py || true

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            signals_state.json
            logs
          key: bot-state-${{ github.run_id }}
