name: Run Python Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Install and Start Proxy (WARP)
      run: |
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ focal main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update
        sudo apt-get install -y cloudflare-warp
        warp-cli --accept-tos registration new
        warp-cli --accept-tos mode proxy
        warp-cli --accept-tos proxy port 40000
        warp-cli --accept-tos connect
        
    - name: Run Bot
      env:
        HTTPS_PROXY: http://127.0.0.1:40000
        HTTP_PROXY: http://127.0.0.1:40000
        # ربط المفاتيح السرية من إعدادات جيت هاب
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # الإعدادات (تم تمريرها كمتغيرات بيئة)
        TRADE_USDT: "3"
        NET_PROFIT_PCT: "1.5"
        STOP_PCT: "2"
        MAX_MINUTES: "60"
        TOP_COINS: "5000"
        TOP_FINAL: "50"
        MIN_WINRATE: "65"
        MODE: "signals"
        TIMEZONE: "Africa/Khartoum"
      run: python bot.py
